# GitHub Pages：只發布網站需要的檔案（tools/build_site.sh 的允許清單）。
# 使用前請到 repo 的 Settings → Pages → Build and deployment，把 Source 改成「GitHub Actions」。
# 改之前（Deploy from a branch）GitHub 會發布整個分支，包括 docs/ 與 source-assets/ 裡的教材原稿與揭曉截圖。
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/build_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
